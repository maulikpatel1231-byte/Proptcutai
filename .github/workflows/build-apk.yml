name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Details ==="
          java -version
          echo "JAVA_HOME is: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          echo "Detected Java version string: ${JAVA_RAW_VERSION}"
          if [ -z "${JAVA_RAW_VERSION}" ]; then
            echo "ERROR: Could not detect Java version." >&2
            exit 1
          fi

          JAVA_MAJOR=$(echo "${JAVA_RAW_VERSION}" | awk -F '.' '{print $1}')
          if [ "${JAVA_MAJOR}" = "1" ]; then
            JAVA_MAJOR=$(echo "${JAVA_RAW_VERSION}" | awk -F '.' '{print $2}')
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or higher. Found: ${JAVA_MAJOR}" >&2
            exit 1
          fi
          echo "Java environment verified successfully (Java ${JAVA_MAJOR} >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore was not created." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected APK not found at ${EXPECTED_APK}" >&2
            echo "Listing files under app/build/outputs/apk if present:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: APK at ${EXPECTED_APK} is empty." >&2
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension." >&2; exit 1 ;;
          esac

          echo "APK successfully verified at ${EXPECTED_APK} (Size: $(stat -c%s "${EXPECTED_APK}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR="${RUNNER_TEMP}/apk-release"
          mkdir -p "${TEMP_DIR}"
          cp "${SRC_APK}" "${TEMP_DIR}/app-debug.apk"

          if [ ! -f "${TEMP_DIR}/app-debug.apk" ] || [ ! -s "${TEMP_DIR}/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare APK release asset." >&2
            exit 1
          fi

          echo "apk_path=${TEMP_DIR}/app-debug.apk" >> $GITHUB_OUTPUT
          echo "Release asset prepared: ${TEMP_DIR}/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.apk_path }}"
          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ]; then
            echo "ERROR: Prepared APK asset not found at ${ASSET_PATH}" >&2
            exit 1
          fi

          if [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Prepared APK is empty." >&2
            exit 1
          fi

          ASSET_FILENAME=$(basename "${ASSET_PATH}")
          if [ "${ASSET_FILENAME}" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk, found ${ASSET_FILENAME}" >&2
            exit 1
          fi

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### 📱 Automated Debug APK Build

          - **Build Type:** Debug APK (Built by GitHub Actions)
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit:** ${GITHUB_SHA}
          - **Signing:** Signed with a temporary debug keystore for testing purposes.
          - **Notice:** This is an automated development debug build, not a production Play Store release.

          **Attached Assets:**
          - \`app-debug.apk\`
          EOF
          )

          echo "Creating GitHub Release with tag: ${TAG}"
          gh release create "${TAG}" "${ASSET_PATH}#app-debug.apk" \
            --title "${TITLE}" \
            --notes "${NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "GitHub Release published successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            echo "=================================================="
            echo "GitHub Release created successfully!"
            gh release view "${TAG}" || true
            echo "Release Tag: ${TAG}"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release Page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK URL: ${DIRECT_URL}"
            echo "=================================================="

            echo "### DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the latest APK directly:" >> $GITHUB_STEP_SUMMARY
            echo "[Download app-debug.apk](${DIRECT_URL})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Direct URL: \`${DIRECT_URL}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> *The standard GitHub Actions artifact \`app-debug-apk\` is also available as a backup.*" >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: GitHub Release creation did not complete successfully or was skipped."
            echo "The Actions artifact 'app-debug-apk' remains available as a backup."
            echo "### ⚠️ Release Publishing Notice" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded, and the Actions artifact \`app-debug-apk\` is available under Workflow Artifacts." >> $GITHUB_STEP_SUMMARY
          fi
